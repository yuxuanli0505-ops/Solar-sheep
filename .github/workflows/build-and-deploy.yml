name: build-and-deploy

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH 私钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.USAARMLOGIN_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 打包站点文件
        run: |
          tar czf "$RUNNER_TEMP/site.tar.gz" \
            --exclude=.git \
            --exclude=.github \
            --exclude=README.md \
            --exclude=.DS_Store \
            .

      - name: 上传并发布到测试服务器
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22 ubuntu@144.24.60.0 \
            'cat > /tmp/solar-sheep-site.tar.gz' < "$RUNNER_TEMP/site.tar.gz"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22 ubuntu@144.24.60.0 '
            sudo mkdir -p /var/admin/solarSheepWeb && \
            sudo find /var/admin/solarSheepWeb -mindepth 1 -maxdepth 1 -exec rm -rf {} + && \
            sudo tar xzf /tmp/solar-sheep-site.tar.gz -C /var/admin/solarSheepWeb && \
            rm -f /tmp/solar-sheep-site.tar.gz
          '
